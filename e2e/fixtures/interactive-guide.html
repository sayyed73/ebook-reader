<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Interactive Test Guide</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora&display=swap" rel="stylesheet" />
    <style>
      body {
        font-family: Georgia, serif;
        background: #f5f0e8;
        margin: 0;
        padding: 24px;
      }
      .tab-panel {
        display: none;
      }
      .tab-panel.active {
        display: block;
      }
      .done {
        color: green;
      }
    </style>
  </head>
  <body>
    <h1>Interactive Test Guide</h1>
    <nav>
      <button class="tab-btn" data-tab="guide">Guide</button>
      <button class="tab-btn" data-tab="notes">Notes</button>
    </nav>
    <div id="guide-panel" class="tab-panel active">
      <p id="mode"></p>
      <ul id="chapters"></ul>
      <p><a id="to-last" href="#chapter-3">Jump to chapter 3</a></p>
      <p><a id="external" href="https://example.com/more">Read more online</a></p>
      <button
        id="reset"
        onclick="
          localStorage.clear();
          location.reload();
        "
      >
        Reset progress
      </button>
    </div>
    <div id="notes-panel" class="tab-panel">
      <textarea id="note" oninput="localStorage.setItem('guide_note', this.value)"></textarea>
    </div>
    <script>
      var CHAPTERS = ['Why sleep got hard', 'The reset framework', 'Anchor your wake time'];
      function lsGet(k, fb) {
        try {
          var v = localStorage.getItem(k);
          return v !== null ? JSON.parse(v) : fb;
        } catch (e) {
          return fb;
        }
      }
      function lsSet(k, v) {
        try {
          localStorage.setItem(k, JSON.stringify(v));
        } catch (e) {}
      }
      var completed = lsGet('guide_completed', {});
      function render() {
        document.getElementById('chapters').innerHTML = CHAPTERS.map(function (title, i) {
          var id = i + 1;
          return (
            '<li id="chapter-' +
            id +
            '"><span class="' +
            (completed[id] ? 'done' : '') +
            '">' +
            title +
            '</span> ' +
            '<button class="mark-btn" data-id="' +
            id +
            '" onclick="toggle(' +
            id +
            ')">' +
            (completed[id] ? 'Completed' : 'Mark complete') +
            '</button></li>'
          );
        }).join('');
      }
      function toggle(id) {
        completed[id] = !completed[id];
        lsSet('guide_completed', completed);
        render();
      }
      document.querySelectorAll('.tab-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          document.querySelectorAll('.tab-panel').forEach(function (p) {
            p.classList.remove('active');
          });
          document.getElementById(btn.dataset.tab + '-panel').classList.add('active');
        });
      });
      document.getElementById('note').value = localStorage.getItem('guide_note') || '';
      document.getElementById('mode').textContent = 'Render mode: ' + document.compatMode;
      render();
    </script>
  </body>
</html>
